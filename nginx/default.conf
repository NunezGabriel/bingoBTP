upstream bingo_backend {
    server backend:3001;
}

upstream bingo_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Tamano generoso: las cartillas viajan completas en JSON.
    client_max_body_size 2m;

    # ---- API ----
    location /api/ {
        proxy_pass http://bingo_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # El backend usa trust proxy para saber si la conexion original fue HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICO para el panel admin en vivo (Server-Sent Events):
        # con buffering activado nginx acumula la respuesta y los eventos
        # no llegan nunca. Tambien hay que desactivar la compresion, que
        # rompe el formato text/event-stream.
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # El stream es una conexion larga: sin esto nginx la corta al minuto.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # ---- Frontend ----
    location / {
        proxy_pass http://bingo_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hot reload y websockets de Next en caso de usar la imagen en dev.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

